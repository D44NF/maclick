name: MaClick
options:
  bundleIdPrefix: com.daanfenske.maclick
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

# Local.xcconfig is gitignored and holds your personal DEVELOPMENT_TEAM, so
# it survives `xcodegen generate` instead of being reset on every run. See
# Config/Local.xcconfig.sample.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  MaClick:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources/Assets.xcassets
      - path: Shared/Sources
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daanfenske.maclick
        CODE_SIGN_ENTITLEMENTS: App/Resources/MaClick.entitlements
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: MaClick
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "12.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 Daan Fenske. GPL-3.0-or-later.
        LSUIElement: true
        NSAppleEventsUsageDescription: MacClick asks Finder which folder is open so actions like "New Text File Here" know where to create things when nothing is selected.
        NSServices:
          - NSMenuItem:
              default: Copy Path
            NSMessage: copyPathService
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Copy SHA-256 Checksum
            NSMessage: copySHA256ChecksumService
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Copy MD5 Checksum
            NSMessage: copyMD5ChecksumService
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Compress to ZIP
            NSMessage: compressToZipService
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Extract ZIP
            NSMessage: extractZipService
            NSSendTypes: [NSFilenamesPboardType]
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          # No NSSendTypes below: these also need to appear with nothing
          # selected (an empty-space right-click), so they fall back to
          # asking Finder for its frontmost window's folder.
          - NSMenuItem:
              default: Open Terminal Here
            NSMessage: openTerminalHereService
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: Open in Visual Studio Code
            NSMessage: openInVSCodeService
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: New Text File Here
            NSMessage: newTextFileService
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
          - NSMenuItem:
              default: New Folder Here
            NSMessage: newFolderService
            NSRequiredContext:
              NSApplicationIdentifier: com.apple.finder
    dependencies:
      - target: MaClickFinderSync
        embed: true
        codeSign: true

  MaClickFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - FinderSync/Sources
      - path: Shared/Sources
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daanfenske.maclick.FinderSync
        CODE_SIGN_ENTITLEMENTS: FinderSync/Resources/FinderSync.entitlements
        ENABLE_HARDENED_RUNTIME: true
        SKIP_INSTALL: true
    info:
      path: FinderSync/Resources/Info.plist
      properties:
        CFBundleDisplayName: MaClick FinderSync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: FinderSyncController

  MaClickTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daanfenske.maclick.Tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: MaClick

schemes:
  MaClick:
    build:
      targets:
        MaClick: all
        MaClickFinderSync: all
        MaClickTests: all
    test:
      targets:
        - MaClickTests
    run:
      config: Debug
